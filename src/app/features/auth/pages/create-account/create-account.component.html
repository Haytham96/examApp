<section class="grid lg:grid-cols-12 h-screen mx-auto">
  <div class="col-span-6 bg-gray-200 h-screen">
    <feature-list featureList="feature-list"></feature-list>
  </div>

  <!-- Login -->
  <div
    class="col-span-6 rounded p-4 mx-auto h-screen w-full flex items-center justify-center bg-white"
  >
    <form class="w-[80%] p-8">
      <h2 class="mb-3 font-light text-4xl">Create Account</h2>
      <div class="flex w-full space-x-2">
        <div class="relative my-3 w-1/2">
          <label for="" class="main-label">First name</label>
          <input
            type="text"
            id=""
            class="main-input"
            placeholder="Ahmed"
            required
          />
        </div>
        <div class="relative my-3 w-1/2">
          <label for="" class="main-label">Last name</label>
          <input
            type="text"
            id=""
            class="main-input"
            placeholder="Abdullah"
            required
          />
        </div>
      </div>
      <div class="relative my-3">
        <label for="" class="main-label">Username</label>
        <input
          type="text"
          id=""
          class="main-input"
          placeholder="user123"
          required
        />
      </div>
      <div class="relative my-3">
        <label for="" class="main-label">Email</label>
        <input
          type="email"
          id=""
          class="main-input"
          placeholder="user@example.com"
          required
        />
      </div>
      <div class="relative my-3">
        <label for="" class="main-label">Phone</label>
        <input
          type="tel"
          id=""
          class="main-input"
          placeholder="EG(+20) 1012345678"
          required
        />
      </div>
      <div class="relative my-3">
        <label for="email" class="main-label">Password</label>
        <input
          type="password"
          id=""
          class="main-input"
          placeholder=""
          required
        />
      </div>
      <div class="relative my-3">
        <label for="email" class="main-label">Cionfirm Password</label>
        <input
          type="password"
          id=""
          class="main-input"
          placeholder=""
          required
        />
      </div>

      <button class="btn my-6 font-mono">create Account</button>
      <div class="flex items-center space-x-1 justify-center font-sans">
        <span>Already have an account?</span>
        <span class="text-blue-800 cursor-pointer font-bold">Login</span>
      </div>
    </form>
  </div>
</section>
